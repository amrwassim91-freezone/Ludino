<title>Ludino — العب أكثر</title>
<style>
:root{--bg:#05080d;--side:#080f17;--card:#0d151f;--card2:#151f2d;--line:#263547;--text:#f5f7fb;--muted:#9aa8b8;--orange:#ff6b20;--blue:#4d65ed;--tag:#1b2a3b;--hov:#172130;--ok:#34d399;--bad:#f87171}
[data-theme=light]{--bg:#eef1f5;--side:#ffffff;--card:#ffffff;--card2:#e9edf2;--line:#d3dae3;--text:#17202a;--muted:#5c6b7a;--tag:#e3e8ee;--hov:#eef1f5}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
#side{position:sticky;top:0;height:100vh;background:var(--side);border-left:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column}
.logo{font-size:26px;font-weight:bold;color:var(--orange);margin:0 8px 26px;line-height:1.2}
.logo small{display:block;font-size:11px;color:var(--muted);font-weight:normal;margin-top:3px}
.lnk{display:flex;gap:10px;align-items:center;padding:12px 10px;border-radius:9px;color:var(--muted);margin-bottom:4px}
.lnk:hover,.lnk.on{color:var(--text);background:var(--hov)}
.lnk.on{border-right:3px solid var(--orange)}
.sidefoot{margin-top:auto;font-size:11px;color:var(--muted);padding:0 8px;line-height:1.7}
#view{padding:24px;max-width:1400px;width:100%;margin:0 auto;min-width:0}
h1{font-size:30px;margin:0 0 6px;line-height:1.25}
h2{font-size:21px;margin:30px 0 12px}
.sub{color:var(--muted);margin:0 0 18px}
.muted{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:9px;padding:11px 18px;background:linear-gradient(135deg,var(--orange),#ffac4c);color:#211006;font-weight:bold;text-align:center}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.big{padding:15px 28px;font-size:17px}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:default}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.panel h3{margin:0 0 10px}
input,select,textarea{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px 12px;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar input[type=search]{flex:1;min-width:200px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:25px;padding:8px 15px;font-size:14px}
.chip.on{background:var(--orange);color:#1b0b03;border-color:var(--orange);font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .2s,border-color .2s}
.card:hover{border-color:var(--orange);transform:translateY(-3px)}
.card>a{display:block}
.cover{position:relative;height:120px;background:var(--card2);overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#000b)}
.cover .nm{position:absolute;z-index:1;bottom:8px;right:10px;left:10px;font-weight:bold;font-size:15px;color:#fff;text-shadow:0 1px 4px #000}
.wish{position:absolute;z-index:2;top:8px;left:8px;width:36px;height:36px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:17px}
.wish.on{color:var(--orange)}
.info{padding:11px 12px;color:var(--muted);font-size:12px}
.info b{display:block;color:var(--text);font-size:14px;margin-bottom:3px}
.tag{display:inline-block;font-style:normal;background:var(--tag);border-radius:5px;padding:3px 7px;margin:6px 0 0 4px;font-size:10px}
.tag.os{background:#14532d;color:#bbf7d0}
.tag.free{background:#064e3b;color:#a7f3d0}
.hero{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:18px;min-height:260px;background:#0d151f}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to left,rgba(5,8,13,.93) 28%,rgba(5,8,13,.1))}
.hx{position:relative;z-index:1;padding:34px;max-width:560px;min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:10px;color:#fff;align-items:flex-start}
.hx h2{margin:0;font-size:36px}
.hx p{margin:0;color:#dbe3ee}
.hx .badge{background:rgba(255,107,32,.2);color:#ffb27d;border:1px solid rgba(255,107,32,.4);padding:3px 11px;border-radius:20px;font-size:12px}
.dots{position:absolute;z-index:2;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:#fff6;padding:0}
.dots button.on{background:var(--orange);width:24px;border-radius:6px}
.promo{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:20px;margin:26px 0;border:1px solid #554629;border-radius:12px;background:linear-gradient(120deg,#19170f,#1c1408);color:#f5f7fb}
.promo p{margin:4px 0 0;color:#cfc4a8}
[data-theme=light] .promo{background:#fff6e8;border-color:#e8cf9b;color:#17202a}
[data-theme=light] .promo p{color:#6b5a30}
.back{background:none;border:0;color:var(--muted);padding:4px 0;margin-bottom:10px;font-size:15px}
.back:hover{color:var(--text)}
.ghead{position:relative;border-radius:16px;overflow:hidden;min-height:240px;border:1px solid var(--line);margin-bottom:18px;background:var(--card2)}
.ghead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.gt{position:absolute;z-index:1;right:22px;bottom:18px;left:22px;color:#fff}
.gt h1{margin:0 0 8px;text-shadow:0 2px 8px #000}
.gt .tag{background:#000a;color:#fff}
.gcols{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.lead{font-size:18px;margin:0 0 18px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.note{font-size:13px;color:var(--muted);margin:6px 0 14px}
dl{margin:0}
dl div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
dl div:last-child{border:0}
dt{color:var(--muted)}
dd{margin:0;text-align:left}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev b{margin-left:8px}
.rev .up{color:var(--ok)}.rev .down{color:var(--bad)}
.rev p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
.vote{display:flex;gap:8px;margin-bottom:10px}
.err{color:var(--bad);font-size:13px;min-height:20px;margin:6px 0}
.live .info .worth{display:block}
.live .info .left{display:block;color:var(--orange);font-weight:bold;margin-top:4px}
.auth{max-width:380px}
.auth input{width:100%;margin:6px 0}
.chbar{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.msgs{height:min(420px,55vh);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.m{padding:5px 0}.m b{font-size:14px}.m b.me{color:var(--orange)}.m small{color:var(--muted);margin-right:8px;font-size:11px}
.m p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
.send{display:flex;gap:8px;margin-top:10px}.send input{flex:1}
#toast{position:fixed;bottom:24px;left:24px;background:var(--card);border:1px solid var(--orange);padding:12px 20px;border-radius:12px;box-shadow:0 10px 30px #0008;z-index:99;transform:translateY(120px);opacity:0;transition:transform .3s,opacity .3s;max-width:80vw}
#toast.show{transform:none;opacity:1}
#tabs{display:none}
footer.legal{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
@media(max-width:900px){
 .app{display:block}
 #side{display:none}
 #view{padding:16px 14px 92px}
 #tabs{display:flex;position:fixed;bottom:0;right:0;left:0;z-index:20;background:var(--side);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
 #tabs a{flex:1;text-align:center;font-size:11px;color:var(--muted);padding:5px 2px;display:flex;flex-direction:column;gap:1px}
 #tabs a b{font-size:19px;font-weight:normal}
 #tabs a.on{color:var(--orange)}
 h1{font-size:25px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .cover{height:100px}
 .hx{padding:20px}.hx h2{font-size:27px}
 .gcols{grid-template-columns:1fr}
 .ghead{min-height:200px}

@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

const CH=[["general","# عام"],["lfg","# أبحث عن فريق"],["news","# أخبار الألعاب"],["media","# صور ومقاطع"]];
let chan="general";const sentAt=[];
function chatPage(){view.innerHTML='<h1>الصالون</h1><p class="sub">اللاعبون هنا يتكلمون. اكتب وسلّم.</p><div id="chatbox"></div>';drawChat()}
const AERR={"auth/invalid-email":"البريد غير صحيح.","auth/invalid-credential":"البريد أو كلمة المرور خاطئة.","auth/email-already-in-use":"هذا البريد مسجّل من قبل.","auth/weak-password":"كلمة المرور ضعيفة (6 أحرف على الأقل).","auth/missing-password":"اكتب كلمة المرور."};
function drawChat(){const box=$("#chatbox");if(!box||location.hash!=="#/chat")return;
 const LU=window.LU;
 if(LU===undefined){box.innerHTML='<div class="panel">جارٍ الاتصال بالصالون...</div>';return}
 if(LU===false){box.innerHTML='<div class="panel">لا يتصل الصالون من هذه الصفحة. يعمل على الموقع المنشور بعد ربطه بـ Firebase.</div>';return}
 unsub.forEach(f=>{try{f()}catch(e){}});unsub=[];
 if(!LU.user){box.innerHTML='<div class="panel auth"><h3>ادخل لتتكلم</h3><p class="muted">التصفح بلا حساب. الحساب فقط للكتابة والتقييم.</p><input id="nm" maxlength="20" placeholder="اسمك بين اللاعبين (للتسجيل)"><input id="em" type="email" dir="ltr" placeholder="البريد"><input id="pw" type="password" dir="ltr" placeholder="كلمة المرور"><div class="err" id="aerr" role="alert"></div><button class="btn" data-a="signin">دخول</button> <button class="btn sec" data-a="signup">حساب جديد</button></div>';return}
 box.innerHTML='<div class="chbar">'+CH.map(c=>'<button class="chip'+(c[0]===chan?" on":"")+'" data-a="chan" data-v="'+c[0]+'">'+c[1]+'</button>').join("")+'</div><div class="msgs" id="msgs" aria-live="polite"></div><div class="send"><input id="tx" maxlength="1000" placeholder="اكتب رسالة" aria-label="رسالة"><button class="btn" data-a="send">أرسل</button></div>';
 unsub.push(LU.channel(chan,function(list){const m=$("#msgs");if(!m)return;m.textContent="";list.forEach(x=>{const r=document.createElement("div");r.className="m";const b=document.createElement("b");b.textContent=x.name||"—";if(LU.user&&x.uid===LU.user.uid)b.className="me";const t=document.createElement("small");t.textContent=x.createdAt&&x.createdAt.toDate?x.createdAt.toDate().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";const p=document.createElement("p");p.textContent=x.text;r.append(b,t,p);m.append(r)});m.scrollTop=m.scrollHeight},function(){const m=$("#msgs");if(m)m.textContent="تعذّرت قراءة الرسائل."}))}
async function authDo(kind){const LU=window.LU,e=$("#aerr");try{if(kind==="up"){const n=$("#nm").value.trim();if(!n){e.textContent="اكتب اسمك بين اللاعبين.";return}await LU.signUp(n,$("#em").value.trim(),$("#pw").value)}else await LU.signIn($("#em").value.trim(),$("#pw").value)}catch(x){e.textContent=AERR[x&&x.code]||"تعذّر التنفيذ. حاول مرة أخرى."}}

/* ===== حسابي ===== */
function mePage(){const LU=window.LU,u=LU&&LU.user;
 const ws=Array.from(wish).map(s=>bySlug[s]).filter(Boolean);
 view.innerHTML='<h1>حسابي</h1><p class="sub">قائمتك وإعداداتك.</p>'+
 '<div class="panel"><h3>الحساب</h3><p class="muted" id="acct">'+(LU===undefined?"جارٍ الاتصال...":LU===false?"غير متصل هنا.":u?"مسجّل باسم: "+esc(u.displayName||u.email):"لم تسجّل الدخول.")+'</p>'+(u?'<button class="btn sec" data-a="signout">تسجيل الخروج</button>':'<a class="btn" href="#/chat">الدخول أو إنشاء حساب</a>')+'</div>'+
 '<h2 style="margin-top:6px">قائمة أمنياتي ('+ws.length+')</h2>'+(ws.length?'<div class="grid">'+ws.map(card).join("")+'</div>':'<p class="muted">فارغة. اضغط ♥ على أي لعبة تعجبك.</p>')+
 '<h2>الإعدادات</h2><div class="panel"><div class="bar"><label>المظهر<br><select id="theme"><option value="dark">داكن</option><option value="light"'+(document.documentElement.dataset.theme==="light"?" selected":"")+'>فاتح</option></select></label><button class="btn sec" data-a="clearwish" style="align-self:flex-end">امسح قائمة الأمنيات</button></div></div>'+
 '<div class="panel"><h3>ناقصك لعبة؟</h3><p class="muted">اكتب اسمها ومنصتها ونراجعها.</p><textarea id="stext" maxlength="500" placeholder="اسم اللعبة، والجهاز، ورابطها إن وجد"></textarea><div class="err" id="serr"></div><button class="btn" data-a="suggest">أرسل الاقتراح</button></div>'+
 '<footer class="legal">الألعاب وأسماؤها وصورها ملك أصحابها. لودينو لا يستضيف ملفات الألعاب، وإنما يوصلك إلى متاجرها ومواقعها الرسمية.</footer>'}

/* ===== توجيه ===== */
const pages={"":storePage,free:freePage,pick:pickPage,chat:chatPage,me:mePage};
function route(){stopTimers();ys[cur]=window.scrollY;
 const h=location.hash.replace(/^#\/?/,""),a=h.split("/"),r=a[0];
 $$("[data-nav]").forEach(x=>x.classList.toggle("on",x.dataset.nav===(r==="game"?"":r)));
 cur=r==="game"?"game/"+a[1]:r;
 if(r==="game")gamePage(decodeURIComponent(a[1]||""));else(pages[r]||storePage)();
 window.scrollTo(0,r===""&&ys[""]?ys[""]:0)}
window.addEventListener("hashchange",route);

/* ===== أحداث ===== */
function setWish(s){if(wish.has(s)){wish.delete(s);toast("أُزيلت من أمنياتك")}else{wish.add(s);toast("أُضيفت إلى أمنياتك ♥")}saveWish();
 $$('[data-a="wish"]').forEach(b=>{if(b.dataset.n===s)b.classList.toggle("on",wish.has(s))})}
document.addEventListener("click",function(e){const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==="wish"){e.preventDefault();e.stopPropagation();setWish(b.dataset.n);if(location.hash==="#/me")mePage()}
 else if(a==="back"){history.length>1?history.back():location.hash="#/"}
 else if(a==="share"){const u=location.href,t=document.title;if(navigator.share){navigator.share({title:t,url:u}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){toast("نُسخ الرابط")},function(){toast(u)})}else toast(u)}
 else if(a==="plat"){st.plat=v;updateGrid()}
 else if(a==="cat"){st.cat=v;updateGrid()}
 else if(a==="rand"){const g=games[Math.floor(Math.random()*games.length)];location.hash="#/game/"+slug(g.n)}
 else if(a==="hero"){hi=+v;$("#hero").innerHTML=heroHTML();clearInterval(heroT)}
 else if(a==="reshuffle"){pk.seed++;pickDraw()}
 else if(a==="chan"){chan=v;drawChat()}
 else if(a==="signin")authDo("in");
 else if(a==="signup")authDo("up");
 else if(a==="signout"){window.LU&&window.LU.signOut()}
 else if(a==="send"){const i=$("#tx"),t=i.value.trim();if(!t)return;const now=Date.now();while(sentAt.length&&now-sentAt[0]>10000)sentAt.shift();if(sentAt.length>=5){toast("أرسلت كثيرًا. انتظر ثواني.");return}sentAt.push(now);i.value="";window.LU.send(chan,t).catch(function(){i.value=t;toast("تعذّر الإرسال")})}
 else if(a==="vote"){vote=v==="1";$$('[data-a="vote"]').forEach(x=>x.classList.toggle("on",x===b))}
 else if(a==="postrev"){const e2=$("#rerr");if(vote===null){e2.textContent="اختر: أنصح بها أو لا أنصح.";return}e2.textContent="";window.LU.postReview(b.dataset.n,vote,$("#rtext").value.trim()).then(function(){toast("شكرًا، نُشر رأيك");$("#rtext").value=""}).catch(function(){e2.textContent="تعذّر النشر. تأكد من الاتصال."})}
 else if(a==="clearwish"){wish.clear();saveWish();mePage();toast("مُسحت القائمة")}
 else if(a==="suggest"){const t=$("#stext").value.trim(),er=$("#serr");if(!t){er.textContent="اكتب شيئًا أولًا.";return}if(!window.LU||!window.LU.user){er.textContent="سجّل دخولك أولًا.";return}er.textContent="";window.LU.suggest(t).then(function(){$("#stext").value="";toast("وصلنا اقتراحك، شكرًا")}).catch(function(){er.textContent="تعذّر الإرسال."})}
});
document.addEventListener("input",function(e){if(e.target.id==="q"){st.q=e.target.value;updateGrid()}});
document.addEventListener("change",function(e){const id=e.target.id;
 if(id==="sort"){st.sort=e.target.value;updateGrid()}
 else if(id==="pdev"){pk.dev=e.target.value;pk.seed=0;pickDraw()}
 else if(id==="pmood"){pk.mood=e.target.value;pk.seed=0;pickDraw()}
 else if(id==="theme"){document.documentElement.dataset.theme=e.target.value;ls.set("ludino_theme",e.target.value);const m=$('meta[name="theme-color"]');if(m)m.content=e.target.value==="light"?"#eef1f5":"#ff6b20"}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="tx"){const b=$('[data-a="send"]');if(b)b.click()}});
function live(){const h=location.hash;if(h==="#/chat")drawChat();else if(/^#\/game\//.test(h)){unsub.forEach(f=>{try{f()}catch(e){}});unsub=[];drawReviews(h.split("/")[2])}else if(h==="#/me")mePage()}
window.addEventListener("lu-ready",live);window.addEventListener("lu-auth",live);
route();
})();
</script>

<script type="module">
/* إعدادات مشروعك في Firebase */
const cfg={apiKey:"AIzaSyC0rA0NufCRM2uMeP5z37dcjMbC4oCANOg",authDomain:"ludino-bca0a.firebaseapp.com",projectId:"ludino-bca0a",storageBucket:"ludino-bca0a.firebasestorage.app",messagingSenderId:"234584619277",appId:"1:234584619277:web:b0427fb8c356991b83d844"};
const V="https://www.gstatic.com/firebasejs/10.12.2/";
(async function(){
 try{
  const [{initializeApp},A,F]=await Promise.all([import(V+"firebase-app.js"),import(V+"firebase-auth.js"),import(V+"firebase-firestore.js")]);
  const app=initializeApp(cfg),auth=A.getAuth(app),db=F.getFirestore(app);
  const nm=()=>auth.currentUser.displayName||"—";
  window.LU={
   get user(){return auth.currentUser},
   signIn:(e,p)=>A.signInWithEmailAndPassword(auth,e,p),
   async signUp(n,e,p){const c=await A.createUserWithEmailAndPassword(auth,e,p);await A.updateProfile(c.user,{displayName:n});return c.user},
   signOut:()=>A.signOut(auth),
   channel(ch,cb,err){const q=F.query(F.collection(db,"channels",ch,"messages"),F.orderBy("createdAt","asc"),F.limit(100));return F.onSnapshot(q,s=>cb(s.docs.map(d=>d.data())),err)},
   send:(ch,text)=>F.addDoc(F.collection(db,"channels",ch,"messages"),{text:text,uid:auth.currentUser.uid,name:nm(),createdAt:F.serverTimestamp()}),
   reviews(slug,cb,err){const q=F.query(F.collection(db,"reviews"),F.where("slug","==",slug),F.limit(50));return F.onSnapshot(q,s=>cb(s.docs.map(d=>d.data())),err)},
   postReview:(slug,up,text)=>F.setDoc(F.doc(db,"reviews",slug+"__"+auth.currentUser.uid),{slug:slug,uid:auth.currentUser.uid,name:nm(),up:up,text:text,createdAt:F.serverTimestamp()}),
   suggest:(text)=>F.addDoc(F.collection(db,"suggestions"),{text:text,uid:auth.currentUser.uid,name:nm(),createdAt:F.serverTimestamp()})
  };
  A.onAuthStateChanged(auth,()=>window.dispatchEvent(new Event("lu-auth")));
 }catch(e){window.LU=false}
 window.dispatchEvent(new Event("lu-ready"));
})();
